<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Ashley ♡</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #fff8f6;
    font-family: Georgia, serif;
    color: #4b3535;
}


/* ---------- OPENING SCREEN ---------- */

#opening {
    position: fixed;
    inset: 0;
    background: #fff8f6;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;
    padding: 30px;

    z-index: 100;
    transition: opacity 1s ease;
}

#opening h1 {
    font-size: 42px;
    margin: 0 0 15px;
}

#opening p {
    font-size: 17px;
    opacity: 0.7;
    margin-bottom: 35px;
}

#startButton {
    border: none;
    background: #4b3535;
    color: white;

    font-family: Georgia, serif;
    font-size: 17px;

    padding: 15px 30px;
    border-radius: 50px;

    cursor: pointer;
}


/* ---------- PHOTO COLLAGE ---------- */

.gallery {
    max-width: 650px;
    margin: auto;

    padding: 50px 18px 120px;
}

.photo {
    background: white;

    padding: 10px;

    margin: 45px auto;

    width: 92%;

    box-shadow: 0 8px 25px rgba(0,0,0,0.12);

    border-radius: 3px;
}

.photo img {
    width: 100%;
    height: auto;

    display: block;

    border-radius: 2px;
}


/* Make photos slightly tilted */

.photo:nth-child(odd) {
    transform: rotate(-1.5deg);
}

.photo:nth-child(even) {
    transform: rotate(1.5deg);
}


/* ---------- END ---------- */

.end {
    text-align: center;
    padding: 30px 30px 120px;
}

.end h2 {
    font-size: 30px;
    font-weight: normal;
}

</style>

</head>


<body>


<!-- MUSIC -->

<audio id="music" loop>
    <source src="song.mp3" type="audio/mpeg">
</audio>



<!-- OPENING SCREEN -->

<div id="opening">

    <h1>Happy Birthday Ashley ♡</h1>

    <p>
        I made something for you.
    </p>

    <button id="startButton" onclick="startMemory()">
        tap to begin ♡
    </button>

</div>



<!-- PHOTOS -->

<div class="gallery">

    <div class="photo">
        <img src="ALB01.jpeg">
    </div>


    <div class="photo">
        <img src="ALB02.JPG">
    </div>


    <div class="photo">
        <img src="ALB03.jpg">
    </div>

</div>



<!-- END -->

<div class="end">

    <h2>Happy Birthday ♡</h2>

</div>



<script>

function startMemory() {

    const opening = document.getElementById("opening");
    const music = document.getElementById("music");

    /* Start the music */
    music.play().catch(function(error) {
        console.log("Music could not start:", error);
    });

    /* Fade away opening screen */
    opening.style.opacity = "0";

    setTimeout(function() {
        opening.style.display = "none";
    }, 1000);

}

</script>


</body>
</html>
