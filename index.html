<!DOCTYPE html>
<html lang="en">

<title>Happy Birthday Ashley ♡</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #fff8f6;
    font-family: Georgia, serif;
    color: #4b3535;
}

/* OPENING SCREEN */

#opening {
    position: fixed;
    inset: 0;
    background: #fff8f6;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px;
    z-index: 100;
    transition: opacity 1s ease;
}

#opening h1 {
    font-size: 42px;
    margin: 0 0 35px;
}

#startButton {
    border: none;
    background: #4b3535;
    color: white;
    font-family: Georgia, serif;
    font-size: 17px;
    padding: 15px 30px;
    border-radius: 50px;
    cursor: pointer;
}

/* PHOTO GALLERY */

.gallery {
    max-width: 650px;
    margin: auto;
    padding: 50px 18px 120px;
}

.photo {
    background: white;
    padding: 10px;
    margin: 45px auto;
    width: 92%;
    box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    border-radius: 3px;
}

.photo img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 2px;
}

/* ALTERNATING TILT */

.photo:nth-child(odd) {
    transform: rotate(-1.5deg);
}

.photo:nth-child(even) {
    transform: rotate(1.5deg);
}

/* END */

.end {
    text-align: center;
    padding: 30px 30px 120px;
}

.end h2 {
    font-size: 30px;
    font-weight: normal;
}

</style>
</head>

<body>

<!-- MUSIC -->

    <source src="VultureCity.mp3.mp3" type="audio/mpeg">
</audio>

<script>

function startMemory() {

    const opening = document.getElementById("opening");
    const music = document.getElementById("music");

    music.play();

    opening.style.opacity = "0";

    setTimeout(function() {
        opening.style.display = "none";

}
